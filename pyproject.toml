[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matobserver"
version = "0.4.0"
description = "MatNexus용 재료 역공학(FEMU) 엔진 — 시험 곡선에 LS-DYNA 해석을 맞춰 재료 카드를 식별한다."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---- core (Impl-Backend) ----
    "numpy>=1.26",
    "pyyaml>=6.0",
    # ---- Impl-Backend (api/, jobs/, matnexus/, recipes/, cli.py) ----
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # POST /v1/files, POST /v1/admin/recipes (multipart)
    # ---- Impl-Mesh (mesh/) — 시스템 라이브러리 libGLU 필요 ----
    "gmsh>=4.15,<5",
    # ---- Impl-Optim (optimizers/, engine/) ----
    "scipy>=1.11",
    # ---- Impl-Solver (solvers/lsdyna/, deck/) — binout·d3plot 리더 ----
    "lasso-python>=2.0.4",
]

[project.scripts]
matobserver = "matobserver.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# lsdyna 마커 = 실제 LS-DYNA 실행이 필요한 시험. 기본 실행에서 제외한다 (포함하려면 `pytest -m lsdyna`).
# importlib 모드: tests/unit/<package>/ 아래 같은 파일명이 있어도 충돌하지 않는다.
addopts = "-m 'not lsdyna' --import-mode=importlib --strict-markers"
markers = [
    "lsdyna: LS-DYNA 실행 파일/라이선스가 필요한 시험 (기본 실행에서 제외)",
]

# 설치 스크립트(scripts/windows/install.ps1)가 <venv>\share\matobserver\ 에서 플러그인 레지스트리·예시 설정을 복사한다 (deploy.md §1.3 6단계)
[tool.setuptools.data-files]
"share/matobserver/plugins.d" = ["config/plugins.d/*.yaml"]
"share/matobserver/config" = ["config/matobserver.example.yaml"]
