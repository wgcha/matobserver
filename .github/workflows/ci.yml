name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # 로컬 Linux 전체 약 2.5분. 느린 Windows 러너 여유 포함 상한
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (LS-DYNA 필요 시험 제외)
        env:
          PYTHONUTF8: "1"
        run: pytest -m "not lsdyna" -q --durations=15

  # B-19 (module-boundaries.md): install.ps1 설치 -> doctor -> start/stop -> -Update -> -Uninstall 스모크 (Windows PowerShell 5.1)
  windows-install:
    name: windows install.ps1 smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Smoke test install.ps1
        shell: powershell
        run: |
          $whl = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $py = (Get-Command python).Source   # setup-python 3.12 (지원 범위 3.11-3.13; 러너 기본 최신 Python 은 의존 휠이 없을 수 있음)
          & .\scripts\windows\tests\smoke.ps1 -Wheel $whl -Python $py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload install logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: ${{ runner.temp }}\mo-smoke\**\logs\*
          if-no-files-found: ignore

  # PowerShell 구문 검사 (pwsh 7, Linux)
  powershell-syntax:
    name: install.ps1 syntax (pwsh)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in 'scripts/windows/install.ps1', 'scripts/windows/tests/smoke.ps1') {
            $errs = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errs)
            if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Host "$f`:$($_.Extent.StartLineNumber) $($_.Message)" }; $bad = 1 }
          }
          exit $bad
