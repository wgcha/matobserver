name: release

# 태그 vX.Y.Z (또는 vX.Y.Z-rc.N) 푸시 -> 같은 커밋에서 CI 재실행 -> wheel·sdist·SHA256SUMS·install.ps1 을 GitHub 릴리스로 게시 (deploy.md §3)
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    name: tag format and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["TAG"]
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)(-rc\.(\d+))?", tag)
          if not m:
              sys.exit(f"tag {tag!r} is not vX.Y.Z or vX.Y.Z-rc.N (deploy.md section 3.2)")
          base, rc = m.group(1), m.group(3)
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          allowed = {base} if rc is None else {base, f"{base}rc{rc}", f"{base}-rc.{rc}"}
          if ver not in allowed:
              sys.exit(f"pyproject version {ver!r} does not match tag {tag!r} (expected one of {sorted(allowed)})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={'true' if rc is not None else 'false'}\n")
              f.write(f"version={ver}\n")
          print(f"tag {tag} matches pyproject version {ver}")
          PY

  ci:
    name: tests on the tagged commit
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build:
    name: build artifacts
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
      - name: Check wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("dist/matobserver-*-py3-none-any.whl")
          assert len(wheels) == 1, f"expected one py3-none-any wheel, got {wheels}"
          names = zipfile.ZipFile(wheels[0]).namelist()
          for need in ("share/matobserver/plugins.d/optim.yaml", "share/matobserver/plugins.d/solver.yaml",
                       "share/matobserver/plugins.d/mesh.yaml", "share/matobserver/config/matobserver.example.yaml"):
              assert any(n.endswith(need) for n in names), f"wheel lacks {need}"
          assert any(n.endswith("matobserver/cli.py") for n in names)
          print("wheel ok:", wheels[0])
          PY
      - name: SHA256SUMS
        run: |
          cp scripts/windows/install.ps1 dist/install.ps1
          cd dist
          sha256sum matobserver-*-py3-none-any.whl matobserver-*.tar.gz install.ps1 > SHA256SUMS
          cat SHA256SUMS
          # install.ps1 의 파서와 같은 형식인지 확인: ^([0-9a-fA-F]{64})\s+\*?(.+)$
          python -c "import re,sys; [sys.exit('bad line: '+l) for l in open('SHA256SUMS').read().splitlines() if not re.match(r'^([0-9a-fA-F]{64})\s+\*?(.+)$', l)]"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          contract schema_version 1.3 · package ${VERSION}

          ## Windows install (PowerShell, no administrator rights needed)

          \`\`\`powershell
          iwr https://github.com/${REPO}/releases/download/${TAG}/install.ps1 -OutFile install.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -Tag ${TAG}
          \`\`\`

          Python 3.11-3.13 (64-bit) is required and is not installed automatically. Assets are verified against \`SHA256SUMS\`. See docs/contracts/deploy.md.
          EOF
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --notes-file notes.md --verify-tag $flags
